<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACU — 針灸 × PNF 3D 輔助</title>
<style>
  :root {
    --bg: #101418; --panel: #1a2027; --panel2: #222a33; --line: #303a45;
    --text: #e8edf2; --dim: #8fa0b0; --accent: #4fc3f7; --hot: #ff6b6b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body { background: var(--bg); color: var(--text); font-family: "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif; display: flex; }

  #sidebar { width: 300px; min-width: 300px; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; }
  #brand { padding: 12px 14px; border-bottom: 1px solid var(--line); }
  #brand h1 { font-size: 17px; letter-spacing: 1px; }
  #brand h1 span { color: var(--accent); }
  #brand p { font-size: 11px; color: var(--dim); margin-top: 2px; }

  #tabs { display: flex; border-bottom: 1px solid var(--line); }
  .tab { flex: 1; text-align: center; padding: 9px 0; font-size: 14px; cursor: pointer; color: var(--dim); border-bottom: 2px solid transparent; }
  .tab.active { color: var(--text); border-bottom-color: var(--accent); }

  .pane { flex: 1; overflow-y: auto; padding: 10px 12px; display: none; }
  .pane.active { display: block; }

  #search { width: 100%; padding: 7px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel2); color: var(--text); font-size: 13px; margin-bottom: 10px; }
  #search:focus { outline: 1px solid var(--accent); }

  .mrow { display: flex; align-items: center; gap: 7px; padding: 4px 2px; font-size: 13px; cursor: pointer; border-radius: 4px; }
  .mrow:hover { background: var(--panel2); }
  .mdot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .mrow .cnt { margin-left: auto; color: var(--dim); font-size: 11px; }
  .quickbtns { display: flex; gap: 6px; margin: 8px 0; }
  .quickbtns button { flex: 1; padding: 5px 0; font-size: 12px; background: var(--panel2); color: var(--dim); border: 1px solid var(--line); border-radius: 5px; cursor: pointer; }
  .quickbtns button:hover { color: var(--text); }

  #ptlist { margin-top: 6px; }
  .prow { padding: 5px 8px; font-size: 13px; cursor: pointer; border-radius: 4px; display: flex; gap: 8px; align-items: baseline; }
  .prow:hover, .prow.sel { background: var(--panel2); }
  .prow .code { color: var(--dim); font-size: 11px; width: 42px; flex: none; }

  .pnfbtn { display: block; width: 100%; text-align: left; padding: 9px 10px; margin-bottom: 7px; background: var(--panel2); border: 1px solid var(--line); border-radius: 7px; color: var(--text); font-size: 14px; cursor: pointer; }
  .pnfbtn small { display: block; color: var(--dim); font-size: 11px; margin-top: 2px; }
  .pnfbtn.sel { border-color: var(--hot); background: #2b2026; }
  #pnfclear { width: 100%; padding: 6px 0; font-size: 12px; background: none; border: 1px dashed var(--line); border-radius: 6px; color: var(--dim); cursor: pointer; margin-bottom: 10px; }

  #viewport { flex: 1; position: relative; }
  #canvas3d { position: absolute; inset: 0; }
  #hint { position: absolute; left: 12px; bottom: 10px; font-size: 11px; color: var(--dim); pointer-events: none; }
  #opacity-ctl { position: absolute; left: 12px; top: 10px; font-size: 12px; color: var(--dim); background: rgba(16,20,24,.7); padding: 6px 10px; border-radius: 6px; display: flex; gap: 8px; align-items: center; }

  #info { position: absolute; right: 12px; top: 12px; width: 320px; max-height: calc(100% - 60px); overflow-y: auto; background: rgba(26,32,39,.96); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: none; }
  #info.show { display: block; }
  #info h2 { font-size: 18px; }
  #info h2 small { color: var(--dim); font-weight: normal; font-size: 12px; margin-left: 6px; }
  #info .meri { font-size: 12px; margin: 4px 0 10px; }
  #info dl { font-size: 13px; line-height: 1.55; }
  #info dt { color: var(--dim); font-size: 11px; margin-top: 8px; }
  #info dd { margin: 1px 0 0; }
  #info .mus-tag, #info .pnf-tag { display: inline-block; font-size: 11px; padding: 2px 7px; border-radius: 10px; margin: 2px 3px 0 0; }
  #info .mus-tag { background: #3a2427; color: #ffb3b3; }
  #info .pnf-tag { background: #1e3a45; color: #9adcf7; cursor: pointer; }
  #info .close { position: absolute; right: 10px; top: 8px; color: var(--dim); cursor: pointer; font-size: 16px; }
  #info .warn { font-size: 11px; color: #f0c36d; margin-top: 10px; }

  #footer { padding: 8px 12px; font-size: 10px; color: var(--dim); border-top: 1px solid var(--line); line-height: 1.5; }
  ::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
</style>
</head>
<body>
  <div id="sidebar">
    <div id="brand">
      <h1>ACU <span>針灸 × PNF</span> 3D 輔助</h1>
      <p>經絡穴位 ↔ 肌肉 ↔ PNF 對角模式</p>
    </div>
    <div id="tabs">
      <div class="tab active" data-pane="pane-meri">經絡穴位</div>
      <div class="tab" data-pane="pane-pnf">PNF 模式</div>
    </div>
    <div id="pane-meri" class="pane active">
      <input id="search" type="text" placeholder="搜尋穴位（名稱或代號）…">
      <div class="quickbtns">
        <button id="btn-all">全選</button>
        <button id="btn-none">全不選</button>
      </div>
      <div id="merilist"></div>
      <div id="ptlist"></div>
    </div>
    <div id="pane-pnf" class="pane">
      <button id="pnfclear">清除模式選取</button>
      <div id="pnflist"></div>
    </div>
    <div id="footer">
      本工具僅供解剖與經絡「學習參考」，穴位座標為示意近似、針刺深度為教科書常見值，不可作為臨床操作依據。實際針灸請由合格中醫師執行。
    </div>
  </div>
  <div id="viewport">
    <div id="canvas3d"></div>
    <div id="opacity-ctl">體表透明度 <input id="op-slider" type="range" min="10" max="100" value="80" style="width:110px"></div>
    <div id="hint">拖曳旋轉｜滾輪縮放｜點擊穴位查看資訊</div>
    <div id="info">
      <span class="close" id="info-close">✕</span>
      <div id="info-body"></div>
    </div>
  </div>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
